[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logsite"
dynamic = ["version"]
description = "See production log volume and log-quality issues inline, next to the log calls in your code."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Raj Paynaik", email = "rajpaynaik18@gmail.com" }]
keywords = ["logging", "observability", "lsp", "linter", "loki", "opensearch", "elasticsearch", "cloudwatch", "vscode", "mcp", "structlog", "loguru", "java", "go", "slf4j", "slog", "zap"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Logging",
]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
  # Java and Go code is read with tree-sitter grammars (small prebuilt wheels).
  "tree-sitter>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-go>=0.23",
]

[project.optional-dependencies]
lsp = ["pygls>=2.0,<3"]
mcp = ["mcp>=2.3,<3"]
cloudwatch = ["boto3>=1.34"]
dev = ["pygls>=2.0,<3", "mcp>=2.3,<3", "pytest>=8", "ruff>=0.6", "structlog>=24", "loguru>=0.7"]

[project.scripts]
logsite = "logsite.cli:main"

[project.urls]
Homepage = "https://github.com/rajpaynaik/logsite"
Issues = "https://github.com/rajpaynaik/logsite/issues"

[tool.hatch.version]
path = "src/logsite/__init__.py"  # the single source of the version

[tool.hatch.build.targets.sdist]
exclude = ["/editors", "/.github"]  # the VS Code extension ships separately

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
