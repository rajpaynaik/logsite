apiVersion: 1

# The logsite server from docker-compose.yaml (demo errors). For your own project, run
#   logsite alert-server --host 0.0.0.0 --token <token>
# next to your code and point `url` at it.
datasources:
  - name: 'logsite'
    uid: 'logsite'
    type: 'rajpaynaik-logsite-datasource'
    access: proxy
    isDefault: true
    orgId: 1
    version: 1
    editable: true
    jsonData:
      url: 'http://logsite:8085'
    secureJsonData:
      token: 'review-token'
