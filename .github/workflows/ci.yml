name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # report every Python version, not just the first failure
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q

  databases:
    # the error store against real Postgres, MySQL, SQL Server and ClickHouse (python: SQLite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logsite
          POSTGRES_PASSWORD: logsite
          POSTGRES_DB: logsite_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: logsite_test
          MYSQL_USER: logsite
          MYSQL_PASSWORD: logsite
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s
          --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Logsite-Test-1
        ports: ["1433:1433"]
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: logsite
          CLICKHOUSE_PASSWORD: logsite
          CLICKHOUSE_DB: logsite_test
        ports: ["8123:8123"]
    env:
      LOGSITE_TEST_POSTGRES: postgresql://logsite:logsite@localhost:5432/logsite_test
      LOGSITE_TEST_MYSQL: mysql://logsite:logsite@127.0.0.1:3306/logsite_test
      LOGSITE_TEST_MSSQL: mssql://sa:Logsite-Test-1@127.0.0.1:1433/logsite_test?TrustServerCertificate=yes
      LOGSITE_TEST_CLICKHOUSE: clickhouse://logsite:logsite@127.0.0.1:8123/logsite_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Microsoft's ODBC driver, if the runner hasn't got it
        run: |
          odbcinst -q -d | grep -q "ODBC Driver 18 for SQL Server" || {
            curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
            curl -sSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update && sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          }
      - run: pip install -e ".[dev,postgres,mysql,mssql,clickhouse]"
      - name: A database in SQL Server (its image has none)
        run: |
          python - <<'PY'
          import time, pyodbc
          conn = "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=Logsite-Test-1;TrustServerCertificate=yes"
          for _ in range(60):
              try:
                  db = pyodbc.connect(conn, autocommit=True)
                  break
              except pyodbc.Error:
                  time.sleep(2)
          db.execute("if db_id('logsite_test') is null create database logsite_test")
          PY
      - run: pytest -q tests/test_watch.py tests/test_store.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The wheel installs and runs
        run: |
          python -m venv /tmp/wheel && /tmp/wheel/bin/pip install "$(ls dist/*.whl)[lsp,mcp]"
          /tmp/wheel/bin/logsite --version && /tmp/wheel/bin/python -m logsite rules > /dev/null

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npx vsce package

  grafana-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/grafana-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/grafana-plugin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - name: Package
        run: |
          id=rajpaynaik-logsite-datasource
          cp -r dist "$id" && zip -qr "$id.zip" "$id" && rm -r "$id"
      - name: Grafana's plugin validator (what the catalog review runs first)
        run: |
          # the source as the reviewers get it from GitHub: no node_modules or build output
          mkdir -p /tmp/source && git archive HEAD . | tar -x -C /tmp/source
          docker run --rm -v "$PWD/rajpaynaik-logsite-datasource.zip:/archive.zip" -v /tmp/source:/src \
            grafana/plugin-validator-cli -sourceCodeUri file:///src /archive.zip
      - name: The reviewers' test environment works (docker compose up)
        run: |
          docker compose up -d --build --wait
          g=http://localhost:3000  # the dev image signs everyone in as admin
          for i in $(seq 60); do curl -sf "$g/api/health" > /dev/null && break; sleep 2; done
          for i in $(seq 30); do curl -sf "$g/api/dashboards/uid/logsite-plugin-errors" > /dev/null && break; sleep 2; done
          curl -sf "$g/api/dashboards/uid/logsite-plugin-errors" > /dev/null
          to=$(($(date +%s) * 1000)); from=$((to - 6 * 3600 * 1000))
          curl -sf "$g/api/datasources/proxy/uid/logsite/logsite/errors?from=$from&to=$to" > errors.json
          jq -e '.groups_total == 3 and (.incidents | length) == 1' errors.json
          jq -r '.incidents[0].diagnosis.hypotheses[0].title' errors.json
      - if: failure()
        run: docker compose logs --tail 80
